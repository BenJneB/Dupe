# Weekly dependency updates (PLAN_V3 phase 16). Dependabot reads this file
# on the default branch only; pull requests target `dev`. Minor and patch
# updates are grouped into one pull request per ecosystem; major updates come
# one by one. The CI "Generated code is up to date" step fails when an update
# (freezed, drift, riverpod…) needs a regeneration: regenerate on the branch.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      pub-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
