# Checks every push and pull request: formatting, generated code, analysis,
# tests with coverage, and builds of the three targets (Windows is only ever
# compiled here).
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed .
      # Catches a stale .g.dart / l10n file, e.g. after a Dependabot update of
      # freezed, drift or riverpod that needs a regeneration.
      - name: Generated code is up to date
        run: |
          dart run build_runner build -d
          flutter gen-l10n
          if [ -n "$(git status --porcelain)" ]; then
            echo "Stale generated files: run 'dart run build_runner build -d' and 'flutter gen-l10n'" >&2
            git status --porcelain >&2
            exit 1
          fi
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Coverage summary
        run: tool/ci/coverage_summary.sh >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build linux --debug --dart-define-from-file=env.example.json

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --debug --dart-define-from-file=env.example.json

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release --dart-define-from-file=env.example.json
      - name: Installer (Inno Setup)
        run: |
          choco install innosetup --version 6.7.1 --no-progress -y
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" packaging/windows/dupe.iss

  # Sync tests against a local Supabase in Docker (PLAN_V3 phase 17): real
  # PostgREST filter, triggers, RLS, auth, storage. Pull requests and `dev`.
  supabase-tests:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: supabase start
      - run: tool/supabase_tests.sh
      - if: always()
        run: supabase stop --no-backup

