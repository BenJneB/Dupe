# Supabase pauses Free projects after a week of low database activity
# (https://supabase.com/docs/guides/platform/free-project-pausing). Once a day,
# call keep_alive() (migration 20261115090000_keep_alive.sql): a real query on
# the database that exposes no data. Fails (GitHub emails the owner) when the
# function is missing or the project does not answer (down or already paused).
#
# GitHub disables scheduled workflows of a public repository after 60 days
# without repository activity, without notification. Without any automatic
# commit, this workflow re-enables itself through the REST API at each run
# (PUT .../actions/workflows/keep-alive.yml/enable). GitHub does not document
# whether this resets the 60-day counter: if the workflow is disabled anyway,
# re-enable it in the Actions tab (README, "Supabase gratuit").
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call keep_alive()
        env:
          ENV_JSON: ${{ secrets.ENV_JSON }}
        run: |
          URL=$(printf '%s' "$ENV_JSON" | jq -r '.SUPABASE_URL // empty')
          KEY=$(printf '%s' "$ENV_JSON" | jq -r '.SUPABASE_ANON_KEY // empty')
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "No Supabase in ENV_JSON: nothing to keep awake."
            exit 0
          fi
          echo "::add-mask::$URL"
          echo "::add-mask::$KEY"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}' \
            "$URL/rest/v1/rpc/keep_alive")
          echo "HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "keep_alive() failed: migration applied? project paused?" >&2
            exit 1
          fi
      - name: Keep this scheduled workflow enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-alive.yml/enable"
