# Git hooks (PLAN_V3 phase 18), lefthook 2.2.2. Once per clone: `lefthook install`
# (README, "Hooks git"). Skip exceptionally with LEFTHOOK=0 git commit ...
glob_matcher: doublestar

pre-commit:
  # Format and analysis run side by side; both skip commits without Dart
  # files (documentation-only commits are instant).
  parallel: true
  jobs:
    - name: format
      glob: "**/*.dart"
      run: dart format {staged_files}
      stage_fixed: true
    - name: analyze
      glob: "**/*.dart"
      run: flutter analyze

pre-push:
  jobs:
    - name: test
      run: flutter test

commit-msg:
  jobs:
    - name: conventional commit
      run: tool/check_commit_msg.sh {1}
