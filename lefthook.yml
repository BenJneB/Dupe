# Git hooks (PLAN_V3 phase 18), lefthook 2.2.2. Once per clone: `lefthook install`
# (README, "Hooks git"). Skip exceptionally with LEFTHOOK=0 git commit ...
glob_matcher: doublestar

pre-commit:
  # Formatting runs beside the generated-code check, which runs before the
  # analysis; all skip commits without Dart or ARB files (documentation-only
  # commits are instant).
  parallel: true
  jobs:
    - name: format
      glob: "**/*.dart"
      run: dart format {staged_files}
      stage_fixed: true
    - group:
        piped: true
        jobs:
          # The CI refuses stale generated code: caught here instead.
          - name: generated code
            glob: "**/*.{dart,arb}"
            run: tool/ci/check_generated.sh
          - name: analyze
            glob: "**/*.dart"
            run: flutter analyze

pre-push:
  jobs:
    - name: test
      run: flutter test

commit-msg:
  jobs:
    - name: conventional commit
      run: tool/check_commit_msg.sh {1}
